name: pastebin

x-storagenode: &storagenode
  build:
    context: .
    dockerfile: storagenode/Dockerfile
    network: host
  networks:
    - storage
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "nc", "-z", "localhost", "8050"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 5s

services:
  pastebin:
    build:
      context: .
      dockerfile: pastebin/Dockerfile
      network: host
    command:
      - "-addr"
      - ":8080"
      - "-env"
      - "${ENV}"
      - "-flush-interval"
      - "${PASTEBIN_FLUSH_INTERVAL}"
      - "-delete-interval"
      - "${PASTEBIN_DELETE_INTERVAL}"
      - "-shutdown-timeout"
      - "${PASTEBIN_SHUTDOWN_TIMEOUT}"
      - "-db-max-conns"
      - "${PASTEBIN_DB_MAX_CONNS}"
      - "-max-paste-size"
      - "${MAX_BLOB_SIZE}"
      - "-paste-cache-ttl"
      - "${PASTEBIN_PASTE_CACHE_TTL}"
    environment:
      PASTEBIN_POSTGRES_DSN: "postgres://${PASTEBIN_DB_USER}:${PASTEBIN_DB_PASSWORD}@pastebin-postgres:5432/${PASTEBIN_DB_NAME}?sslmode=disable"
      PASTEBIN_REDIS_ADDR: "pastebin-redis:6379"
    networks:
      - gateway
      - pastebin-metadata
      - pastebin-cache
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8080"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    ports:
      - "8080:8080"
    depends_on:
      pastebin-postgres:
        condition: service_healthy
      gateway:
        condition: service_healthy
      pastebin-redis:
        condition: service_healthy

  pastebin-postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNS}"]
    networks:
      - pastebin-metadata
    environment:
      POSTGRES_USER: "${PASTEBIN_DB_USER}"
      POSTGRES_PASSWORD: "${PASTEBIN_DB_PASSWORD:?PASTEBIN_DB_PASSWORD is not set}"
      POSTGRES_DB: "${PASTEBIN_DB_NAME}"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pastebin-postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
  pastebin-redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "${REDIS_MAX_MEMORY}",
        "--maxmemory-policy",
        "volatile-lfu",
      ]
    networks:
      - pastebin-cache
    ports:
      - "127.0.0.1:6379:6379"
    volumes: [pastebin-redis:/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  storagenode-1:
    <<: *storagenode
    ports:
      - "8051:8050"
    volumes:
      - storagenode-1-data:/data

  storagenode-2:
    <<: *storagenode
    ports:
      - "8052:8050"
    volumes:
      - storagenode-2-data:/data

  storagenode-3:
    <<: *storagenode
    ports:
      - "8053:8050"
    volumes:
      - storagenode-3-data:/data

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
      network: host
    command:
      - "-env"
      - "${ENV}"
      - "-nodes"
      - "sn1=storagenode-1:8050,sn2=storagenode-2:8050,sn3=storagenode-3:8050"
      - "-db-max-conns"
      - "${GATEWAY_DB_MAX_CONNS}"
      - "-max-blob-size"
      - "${MAX_BLOB_SIZE}"
      - "-write-timeout"
      - "${GATEWAY_WRITE_TIMEOUT}"
      - "-check-timeout"
      - "${GATEWAY_CHECK_TIMEOUT}"
    environment:
      GATEWAY_DSN: "postgres://${GATEWAY_DB_USER}:${GATEWAY_DB_PASSWORD}@gateway-postgres:5432/${GATEWAY_DB_NAME}?sslmode=disable"
    networks:
      - gateway
      - gateway-metadata
      - storage
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8090"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    volumes:
      - gateway-data:/data
    ports:
      - "8090:8090"
    depends_on:
      gateway-postgres:
        condition: service_healthy
      storagenode-1:
        condition: service_started
      storagenode-2:
        condition: service_started
      storagenode-3:
        condition: service_started

  gateway-postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNS}"]
    networks:
      - gateway-metadata
    environment:
      POSTGRES_USER: "${GATEWAY_DB_USER}"
      POSTGRES_PASSWORD: "${GATEWAY_DB_PASSWORD:?GATEWAY_DB_PASSWORD is not set}"
      POSTGRES_DB: "${GATEWAY_DB_NAME}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - gateway-postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  pastebin-metadata:
    driver: bridge
    ipam:
      config:
        - subnet: 10.151.9.0/24
  gateway:
    driver: bridge
    ipam:
      config:
        - subnet: 10.151.10.0/24
  storage:
    driver: bridge
    ipam:
      config:
        - subnet: 10.151.11.0/24
  gateway-metadata:
    driver: bridge
    ipam:
      config:
        - subnet: 10.151.12.0/24
  pastebin-cache:
    driver: bridge
    ipam:
      config:
        - subnet: 10.151.13.0/24

volumes:
  storagenode-1-data:
  storagenode-2-data:
  storagenode-3-data:
  gateway-data:
  gateway-postgres:
  pastebin-postgres:
  pastebin-redis:

name: pastebin

x-storagenode: &storagenode
  build:
    context: .
    dockerfile: storagenode/Dockerfile
  networks:
    - storage
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "nc", "-z", "localhost", "8050"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 5s

services:
  storagenode-1:
    <<: *storagenode
    ports:
      - "8051:8050"
    volumes:
      - storagenode-1-data:/data

  storagenode-2:
    <<: *storagenode
    ports:
      - "8052:8050"
    volumes:
      - storagenode-2-data:/data

  storagenode-3:
    <<: *storagenode
    ports:
      - "8053:8050"
    volumes:
      - storagenode-3-data:/data

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    networks:
      - gateway
      - gateway-metadata
      - storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8080"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    volumes:
      - gateway-data:/data
    ports:
      - "8080:8080"
    depends_on:
      gateway-postgres:
        condition: service_healthy

  gateway-postgres:
    image: postgres:16-alpine
    networks:
      - gateway-metadata
    environment:
      POSTGRES_USER: "user"
      POSTGRES_PASSWORD: "secret"
      POSTGRES_DB: "gateway"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - gateway-postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  gateway:
    driver: bridge
    ipam:
      config:
        - subnet: 10.151.10.0/24
  storage:
    driver: bridge
    ipam:
      config:
        - subnet: 10.151.11.0/24
  gateway-metadata:
    driver: bridge
    ipam:
      config:
        - subnet: 10.151.12.0/24

volumes:
  storagenode-1-data:
  storagenode-2-data:
  storagenode-3-data:
  gateway-data:
  gateway-postgres:

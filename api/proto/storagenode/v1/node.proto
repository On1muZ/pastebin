syntax = "proto3";

package storagenode.v1;

option go_package = "pastebin/gen/go/storagenode/v1;storagenodev1";

service StorageNode {
  rpc PutBlob(stream PutBlobRequest) returns (PutBlobResponse);
  rpc GetBlob(GetBlobRequest) returns (stream GetBlobResponse);
  rpc DeleteBlob(DeleteBlobRequest) returns (DeleteBlobResponse);
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
}

message BlobHeader {
  string blob_id = 1;
  int64 size_bytes = 2;
}

message PutBlobRequest {
  oneof payload {
    BlobHeader header = 1;
    bytes chunk = 2;
  }
}

message PutBlobResponse {
  string blob_id = 1;
  int64 size_bytes = 2;
  string sha256 = 3;
}

message GetBlobRequest {
  string blob_id = 1;
  int64 offset = 2;
  int64 length = 3;
}

message GetBlobResponse { bytes chunk = 1; }

message DeleteBlobRequest { string blob_id = 1; }

message DeleteBlobResponse {}

message GetStatusRequest {}

message GetStatusResponse {
  reserved 3;
  reserved "blob_count";
  int64 total_bytes = 1;
  int64 free_bytes = 2;
}
